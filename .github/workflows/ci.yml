name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. Most of this toolkit parses the text output of tmutil, diskutil and
    # smartctl, so the likeliest way it breaks is Apple changing a format in a
    # macOS update — not us changing code. A scheduled run catches that.
    - cron: "0 14 * * 1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: macOS version
        run: sw_vers

      - name: Syntax-check every script
        run: |
          for f in bin/*.zsh bin/lib/*.zsh bin/plimsoll extra/swiftbar/*.sh; do
            zsh -n "$f" && echo "ok  $f"
          done

      - name: Lint the LaunchAgent plist
        run: plutil -lint launchd/*.plist

      - name: Dispatcher help works
        run: ./bin/plimsoll --help | grep -q "macOS disk triage"

      - name: Unknown subcommand exits 2
        run: |
          set +e
          ./bin/plimsoll not-a-command >/dev/null 2>&1
          [ $? -eq 2 ] || { echo "expected exit 2"; exit 1; }

      - name: Read-only helpers work unprivileged
        run: |
          zsh -c '
            source bin/lib/common.zsh
            free=$(pl_free_bytes); total=$(pl_total_bytes)
            [[ -n $free && -n $total && $total -gt 0 ]] || { print "container bytes unreadable"; exit 1 }
            print "free=$free total=$total pct=$(pl_pct_free)"
            [[ $(pl_human 1500000000) == "1.5 GB" ]] || { print "pl_human wrong"; exit 1 }
          '

      - name: Sparse files are measured by allocation, not logical size
        run: |
          zsh -c '
            source bin/lib/common.zsh
            mkfile -n 400m /tmp/sparse.bin
            sz=$(pl_size_of /tmp/sparse.bin)
            # ls would report 400 MB; du must report far less.
            (( sz < 10000000 )) || { print "sparse file measured as $sz — regression"; exit 1 }
            print "sparse ok: $sz bytes allocated"
            rm -f /tmp/sparse.bin
          '

      - name: Health model runs and yields a level
        run: |
          zsh -c '
            source bin/lib/common.zsh
            pl_run_health_checks
            lvl=$(pl_overall_level)
            [[ $lvl == (OK|WARN|CRIT) ]] || { print "bad level: $lvl"; exit 1 }
            (( ${#PL_CHECKS} >= 4 )) || { print "expected >=4 checks"; exit 1 }
            print "level=$lvl checks=${#PL_CHECKS}"
          '

      - name: Undeterminable backup age reports UNKNOWN, never OK
        # The single most important behaviour to protect: a check that reads
        # healthy when it cannot tell is worse than no check. This has regressed
        # twice — once via `sudo -n` silently failing, once by treating an
        # unreadable value as absence. Stubbed rather than relying on the runner
        # having no Time Machine, so it is deterministic on a dev machine too.
        run: |
          zsh -c '
            source bin/lib/common.zsh
            pl_tm_days_since_backup() { return 1 }      # simulate unreadable prefs
            pl_run_health_checks
            for c in $PL_CHECKS; do
              [[ $(pl_check_name $c) == Backup ]] || continue
              [[ $(pl_check_level $c) != OK ]] || { print "FAIL: unreadable backup age reported OK"; exit 1 }
              print "correctly non-OK: $(pl_check_headline $c)"
            done
          '

      - name: A fresh backup date does not mask failing attempts
        # The fault this check exists for: SnapshotDates records completions
        # only, so a Mac that attempts hourly and fails every time still reads
        # "0d ago". Age going OK must not be able to make the run OK while
        # RESULT is non-zero -- that is precisely how a chain rots unseen.
        run: |
          zsh -c '
            source bin/lib/common.zsh
            export PL_TM_STATE=$(mktemp -d)/tm.state
            pl_tm_enabled()          { return 0 }
            pl_tm_days_since_backup() { print -r -- 0 }      # backed up "today"
            pl_tm_last_backup_epoch() { print -r -- 1700000000 }
            pl_tm_last_result()       { print -r -- 26 }     # ...and it failed
            pl_run_health_checks
            seen=0
            for c in $PL_CHECKS; do
              [[ $(pl_check_name $c) == "Last attempt" ]] || continue
              seen=1
              [[ $(pl_check_level $c) != OK ]] || { print "FAIL: failing attempt reported OK"; exit 1 }
              print "correctly non-OK: $(pl_check_headline $c)"
            done
            (( seen )) || { print "FAIL: no Last attempt check emitted"; exit 1 }
            [[ $(pl_overall_level) != OK ]] || { print "FAIL: overall level OK despite failing backups"; exit 1 }
          '

      - name: Unreadable attempt outcome reports UNKNOWN, never OK
        run: |
          zsh -c '
            source bin/lib/common.zsh
            pl_tm_enabled()     { return 0 }
            pl_tm_last_result() { return 1 }               # simulate unreadable prefs
            pl_run_health_checks
            for c in $PL_CHECKS; do
              [[ $(pl_check_name $c) == "Last attempt" ]] || continue
              [[ $(pl_check_level $c) != OK ]] || { print "FAIL: unreadable outcome reported OK"; exit 1 }
              print "correctly non-OK: $(pl_check_headline $c)"
            done
          '

      - name: An unreachable destination warns but does not escalate
        # Time Machine reports a laptop on the wrong network with the same
        # code 26 it uses for a link that died mid-copy. Being away is not a
        # fault, so it must not reach CRIT -- but it must not read OK either,
        # because backups genuinely are not happening.
        run: |
          zsh -c '
            source bin/lib/common.zsh
            export PL_TM_STATE=$(mktemp -d)/tm.state
            pl_tm_enabled()                 { return 0 }
            pl_tm_last_backup_epoch()       { print -r -- 1757370669 }
            pl_tm_last_result()             { print -r -- 26 }
            pl_tm_destination_reachable()   { return 1 }
            printf "%s\t%s\n" 1757370669 $(( $(date +%s) - 72*3600 )) > $PL_TM_STATE
            pl_run_health_checks
            seen=0
            for c in $PL_CHECKS; do
              [[ $(pl_check_name $c) == "Last attempt" ]] || continue
              seen=1
              [[ $(pl_check_level $c) == WARN ]] || { print "FAIL: expected WARN, got $(pl_check_level $c)"; exit 1 }
              print "correctly WARN: $(pl_check_headline $c)"
            done
            (( seen )) || { print "FAIL: no Last attempt check"; exit 1 }
            # Time spent away must not accumulate toward the CRIT clock.
            age=$(( ( $(date +%s) - $(cut -f2 $PL_TM_STATE) ) / 3600 ))
            (( age < 1 )) || { print "FAIL: clock not held, ${age}h"; exit 1 }
            print "clock held at now"
          '

      - name: A run skipped on battery warns but does not escalate
        # RESULT 100 with "Computer is on battery power" is Time Machine
        # honouring its own AC-power setting, not a failure. It must not read
        # as an unexplained error, must not reach CRIT, and must not push a
        # notification -- the Backup age row owns "this has gone on too long".
        run: |
          zsh -c '
            source bin/lib/common.zsh
            export PL_TM_STATE=$(mktemp -d)/tm.state
            pl_tm_enabled()           { return 0 }
            pl_tm_last_backup_epoch() { print -r -- 1757370669 }
            pl_tm_last_result()       { print -r -- 100 }
            pl_tm_last_message()      { print -r -- "Computer is on battery power" }
            printf "%s\t%s\n" 1757370669 $(( $(date +%s) - 72*3600 )) > $PL_TM_STATE
            pl_run_health_checks
            seen=0
            for c in $PL_CHECKS; do
              [[ $(pl_check_name $c) == "Last attempt" ]] || continue
              seen=1
              [[ $(pl_check_level $c) == WARN ]] || { print "FAIL: expected WARN, got $(pl_check_level $c)"; exit 1 }
              [[ $(pl_check_headline $c) == *battery* ]] || { print "FAIL: headline $(pl_check_headline $c)"; exit 1 }
              print "correctly WARN: $(pl_check_headline $c)"
            done
            (( seen )) || { print "FAIL: no Last attempt check"; exit 1 }
            (( PL_TM_EXPECTED )) || { print "FAIL: not marked expected, guard would notify"; exit 1 }
            age=$(( ( $(date +%s) - $(cut -f2 $PL_TM_STATE) ) / 3600 ))
            (( age < 1 )) || { print "FAIL: clock not held, ${age}h"; exit 1 }
            print "clock held at now"
          '

      - name: A stale battery message cannot talk down a real failure
        # MessageParameters can outlive the result it described. Only code 100
        # may be read as a battery skip.
        run: |
          zsh -c '
            source bin/lib/common.zsh
            pl_tm_skipped_on_battery 26 "Computer is on battery power" \
              && { print "FAIL: code 26 read as a battery skip"; exit 1 }
            print "code 26 stays a failure"
          '

      - name: Failure advice survives a SwiftBar tooltip
        # Tooltips strip " and swap | for a lookalike, so advice that spells
        # out a quoted predicate or a pipeline pastes as a broken command.
        run: |
          zsh -c '
            source bin/lib/common.zsh
            for code in 26 31 70 100 999; do
              r=$(pl_tm_result_remedy $code)
              [[ $r != *[\"\|]* ]] || { print "FAIL: remedy for $code has a quote or pipe: $r"; exit 1 }
            done
            print "remedies are tooltip-safe"
          '
          set +e
          ./bin/plimsoll tm-log --last nope >/dev/null 2>&1
          [ $? -eq 2 ] || { echo "FAIL: bad --last not rejected"; exit 1; }

      - name: An unknown reachability probe still escalates
        # Never go quiet on uncertainty -- that is the failure this whole
        # toolkit exists to catch. Only a definite "not reachable" suppresses.
        run: |
          zsh -c '
            source bin/lib/common.zsh
            export PL_TM_STATE=$(mktemp -d)/tm.state
            pl_tm_enabled()               { return 0 }
            pl_tm_last_backup_epoch()     { print -r -- 1757370669 }
            pl_tm_last_result()           { print -r -- 26 }
            pl_tm_destination_reachable() { return 2 }        # cannot tell
            printf "%s\t%s\n" 1757370669 $(( $(date +%s) - 13*3600 )) > $PL_TM_STATE
            pl_run_health_checks
            for c in $PL_CHECKS; do
              [[ $(pl_check_name $c) == "Last attempt" ]] || continue
              [[ $(pl_check_level $c) == CRIT ]] || { print "FAIL: uncertainty went quiet: $(pl_check_level $c)"; exit 1 }
              print "correctly CRIT despite an unreadable probe: $(pl_check_headline $c)"
            done
          '

      - name: A failing attempt names a next step
        # A cause with no remedy is a dead end: "backup disk locked" used to be
        # the whole message, and the guard filled the gap with reclaim advice
        # that frees space and does nothing for a lock. Unknown codes must get
        # the lookup command rather than a guessed fix.
        run: |
          zsh -c '
            source bin/lib/common.zsh
            export PL_TM_STATE=$(mktemp -d)/tm.state
            pl_tm_enabled()               { return 0 }
            pl_tm_last_backup_epoch()     { print -r -- 1757370669 }
            pl_tm_destination_reachable() { return 0 }
            detail_for() {
              pl_tm_last_result() { print -r -- $code }
              pl_run_health_checks
              for c in $PL_CHECKS; do
                [[ $(pl_check_name $c) == "Last attempt" ]] && pl_check_detail $c
              done
            }
            code=31; [[ $(detail_for) == *"restart the NAS"* ]] || { print "FAIL: code 31 has no remedy"; exit 1 }
            code=99; [[ $(detail_for) == *"plimsoll tm-log"* ]] || { print "FAIL: unknown code has no lookup"; exit 1 }
            # Both causes seen for a dropped connection, not just sleep, and
            # the command that tells them apart.
            code=26; [[ $(detail_for) == *sleeping*network*"plimsoll tm-log"* ]] || { print "FAIL: code 26 names one cause or no lookup"; exit 1 }
            # Bare `log` is a zsh builtin: pasted into the default shell it
            # prints nothing, which reads as "no errors".
            for code in 26 31 70 99; do
              d=$(detail_for)
              [[ ${d//\/usr\/bin\/log show/} != *"log show"* ]] || { print "FAIL: code $code suggests bare log"; exit 1 }
            done
            print "remedies present"
          '

      - name: The guard survives brew upgrade, and a dead one is reported
        # install-guard used to write the versioned Cellar path into the plist.
        # The next upgrade deleted it, launchd exited 127 every run, and the
        # guard stayed "loaded" while checking nothing for a week.
        run: |
          set -e
          fake=$(mktemp -d)
          mkdir -p $fake/Cellar/plimsoll/9.9.9/libexec $fake/opt
          ln -s ../Cellar/plimsoll/9.9.9 $fake/opt/plimsoll
          got=$(zsh -c "source bin/lib/common.zsh; pl_guard_root $fake/Cellar/plimsoll/9.9.9/libexec")
          [[ $got == $fake/opt/plimsoll/libexec ]] || { echo "FAIL: baked $got"; exit 1; }
          got=$(zsh -c "source bin/lib/common.zsh; pl_guard_root $PWD")
          [[ $got == $PWD ]] || { echo "FAIL: checkout path rewritten to $got"; exit 1; }

          mkdir -p $fake/Library/LaunchAgents
          sed "s|__PL_ROOT__|$fake/Cellar/plimsoll/0.0.1/libexec|g" launchd/com.plimsoll.diskguard.plist \
            > $fake/Library/LaunchAgents/com.plimsoll.diskguard.plist
          set +e
          out=$(HOME=$fake ./bin/plimsoll guard-status 2>&1); rc=$?
          set -e
          [[ $rc -eq 1 && $out == *dead:* ]] || { echo "FAIL: dead guard not reported ($rc): $out"; exit 1; }
          rm -rf $fake
          echo "stable path baked; dead guard reported"

      - name: A landed backup clears the failure clock
        # Keyed on the last-success date so a chain that recovers does not carry
        # its old clock into an unrelated later failure and jump straight to CRIT.
        run: |
          zsh -c '
            source bin/lib/common.zsh
            export PL_TM_STATE=$(mktemp -d)/tm.state
            printf "%s\t%s\n" stale stamp > $PL_TM_STATE
            pl_tm_enabled()     { return 0 }
            pl_tm_last_result() { print -r -- 0 }
            pl_run_health_checks
            [[ -e $PL_TM_STATE ]] && { print "FAIL: clock survived a successful backup"; exit 1 }
            print "clock cleared"
          '

      - name: Indeterminate backup progress reports no figure, not -100%
        # tmutil reports Percent = -1 whenever a running backup has no
        # measurable progress yet, which every preparation phase does. Scaling
        # that sentinel like a fraction printed "backup RUNNING now (-100.0%)".
        # Scientific notation must keep working alongside it -- that is a real
        # value from a backup ten seconds old, not a rounding curiosity.
        run: |
          zsh -c '
            source bin/lib/common.zsh
            check() {
              local want=$1   # $1 inside tmutil() would be tmutil'"'"'s own, not this one
              tmutil() { print -r -- "    Percent = \"$want\";" }
              if out=$(pl_tm_progress_pct); then print -r -- "$out"; else print -r -- "OMITTED"; fi
            }
            [[ $(check -1) == OMITTED ]] || { print "FAIL: -1 rendered as a percentage"; exit 1 }
            [[ $(check 0.5) == 50.0 ]]   || { print "FAIL: 0.5 did not render as 50.0"; exit 1 }
            [[ $(check 1) == 100.0 ]]    || { print "FAIL: 1 did not render as 100.0"; exit 1 }
            [[ $(check 2.466504299824327e-06) == 0.0 ]] \
              || { print "FAIL: scientific notation regressed"; exit 1 }
            print "sentinel omitted; fractions still scale"
          '

      - name: Worst check always names a subject
        run: |
          zsh -c '
            source bin/lib/common.zsh
            pl_run_health_checks
            w=$(pl_worst_check)
            [[ -n $w ]] || { print "pl_worst_check returned empty"; exit 1 }
            n=$(pl_check_name $w)
            [[ -n $n ]] || { print "worst check has no name"; exit 1 }
            print "subject=$n"
          '

      - name: Guard emits valid JSON
        run: |
          ./bin/disk-guard.zsh --json > /tmp/guard.json || true
          python3 -c "import json; d=json.load(open('/tmp/guard.json')); assert d['level'] in ('OK','WARN','CRIT'), d['level']; assert isinstance(d['checks'], list) and len(d['checks']) >= 4, 'too few checks'; assert d['subject'], 'empty subject'; print('json ok:', d['level'], d['subject'])"

      - name: Destructive paths are dry-run by default
        run: |
          set +e
          out=$(./bin/reclaim.zsh 2>&1)
          echo "$out" | grep -q "dry run" || { echo "reclaim did not announce dry-run"; exit 1; }
          echo "$out" | grep -q "  RUN  " && { echo "reclaim EXECUTED without --apply"; exit 1; }
          echo "$out" | grep -q "re-measuring" && { echo "reclaim dry run started a watchlist walk"; exit 1; }
          out=$(./bin/tm-exclude.zsh 2>&1)
          echo "$out" | grep -qi "dry run\|already excluded" || { echo "tm-exclude not dry-run"; exit 1; }
          echo "dry-run defaults hold"

      - name: A detail containing quotes keeps its menu bar row
        # The guard escapes " as \" in JSON, and the plugin matched details with
        # [^"]*, which stopped at the escape: the row matched nothing and
        # vanished. That hid the Last attempt row for every unnamed failure
        # code, because their advice quotes a log predicate.
        run: |
          set -e
          t=$(mktemp -d)
          cp -R bin extra launchd "$t/"
          # The detail escapes its quotes exactly as disk-guard --json does.
          cat > "$t/bin/disk-guard.zsh" <<'EOF'
          print -r -- '{"level":"WARN","exit":1,"subject":"Last attempt","headline":"failed — backupd error 18","checks":[{"level":"OK","name":"Disk","headline":"40% free","detail":"fine"},{"level":"WARN","name":"Last attempt","headline":"failed — backupd error 18","detail":"Find the cause with: /usr/bin/log show --predicate \"subsystem == x\" | grep BACKUP_FAILED"}],"notes":[]}'
          EOF
          out=$(zsh "$t/extra/swiftbar/plimsoll.10m.sh")
          echo "$out" | grep -q "Last attempt: failed" || { echo "FAIL: a detail with quotes dropped its row"; echo "$out"; exit 1; }
          echo "$out" | grep "Last attempt" | grep -q 'tooltip="Find the cause' || { echo "FAIL: tooltip missing"; echo "$out"; exit 1; }
          rm -rf "$t"
          echo "quoted detail keeps its row"

      - name: SwiftBar plugin renders
        run: |
          out=$(./extra/swiftbar/plimsoll.10m.sh)
          # The title is an SF Symbol, not text: OK is an outline drive, WARN
          # fills it, and only CRIT swaps the glyph and prepends the subject. The
          # emoji this used to assert on went away in 66cc477. Match the glyph
          # rather than merely "sfimage=", because a symbol name that does not
          # exist renders as a blank menu bar item — a silent failure.
          echo "$out" | head -1 \
            | grep -qE 'sfimage=(internaldrive|internaldrive\.fill|exclamationmark\.triangle\.fill)$' \
            || { echo "no menu bar title, or an unknown SF Symbol"; exit 1; }
          echo "$out" | grep -q -- "---" || { echo "no separator"; exit 1; }
          echo "$out"

      - name: Migration from sparkling-clean keeps the history and leaves one guard
        run: |
          set -e
          # The fault this guards against is a half-migrated machine running two
          # guards: double notifications, two writers on one log, and de-dup
          # state split across two files so neither suppresses correctly. The
          # fixture is a whole fake $HOME, because every path the migration
          # touches hangs off it.
          fake=$(mktemp -d)
          old=$fake/.local/state/sparkling-clean
          plugins="$fake/Library/Application Support/SwiftBarPlugins"
          mkdir -p "$old" "$fake/Library/LaunchAgents" "$plugins"
          printf 'history that must survive\n' > "$old/sparkling-clean.log"
          printf 'CRIT\t1788660536\n'          > "$old/guard.state"
          sed 's|com.plimsoll.diskguard|com.sparklingclean.diskguard|' \
            launchd/com.plimsoll.diskguard.plist \
            > "$fake/Library/LaunchAgents/com.sparklingclean.diskguard.plist"
          ln -s /nonexistent/sparkling-clean.10m.sh "$plugins/sparkling-clean.10m.sh"

          out=$(HOME=$fake SC_WARN_PCT=99 zsh -c 'source bin/lib/common.zsh && pl_migrate_legacy' 2>&1)
          echo "$out"

          [[ -e $fake/Library/LaunchAgents/com.sparklingclean.diskguard.plist ]] \
            && { echo "FAIL: old LaunchAgent survived"; exit 1; }
          [[ -d $old ]] && { echo "FAIL: old state directory survived"; exit 1; }
          grep -q "history that must survive" "$fake/.local/state/plimsoll/plimsoll.log" \
            || { echo "FAIL: health log did not carry over"; exit 1; }
          grep -q "CRIT" "$fake/.local/state/plimsoll/guard.state" \
            || { echo "FAIL: guard de-dup state did not carry over"; exit 1; }
          [[ -e $plugins/sparkling-clean.10m.sh ]] \
            && { echo "FAIL: dead SwiftBar symlink survived"; exit 1; }
          [[ -L $plugins/plimsoll.10m.sh ]] \
            || { echo "FAIL: SwiftBar symlink was not repointed"; exit 1; }
          echo "$out" | grep -q "SC_\* variable" \
            || { echo "FAIL: stale SC_* override was not reported"; exit 1; }

          # Idempotent, and non-destructive when both names have state: run it
          # again with the old directory recreated and the new one populated.
          mkdir -p "$old"
          printf 'stale\n' > "$old/sparkling-clean.log"
          HOME=$fake zsh -c 'source bin/lib/common.zsh && pl_migrate_legacy' 2>&1
          grep -q "history that must survive" "$fake/.local/state/plimsoll/plimsoll.log" \
            || { echo "FAIL: second run clobbered the migrated log"; exit 1; }
          [[ -d $old ]] || { echo "FAIL: second run deleted state it could not merge"; exit 1; }
          rm -rf "$fake"
          echo "migration holds"
